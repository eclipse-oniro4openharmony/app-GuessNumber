name: Verify Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: oniro-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install API 23 build tools
        run: |
          npm install --global @oniroproject/oniro-app@0.10.0
          oniro-app sdk install 6.1
          oniro-app cmdtools install

      - name: Build and sign app
        run: |
          cd "$GITHUB_WORKSPACE"
          cp build-profile.example.json5 build-profile.json5
          oniro-app sign
          oniro-app build --product default --module entry

      - name: Upload built HAP packages
        uses: actions/upload-artifact@v4
        with:
          name: HAP packages
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
